<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OG 分享图模板 · 默语</title>
<style>
  /* 1200x630 定尺模板，仅用于本地导出 OG 图，不参与站点发布 */
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px;
    box-sizing: border-box; overflow: hidden;
    background: #ffffff;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Inter", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    box-sizing: border-box;
    width: 1200px; height: 630px;
    padding: 96px 88px;
    display: flex; flex-direction: column; justify-content: center;
    position: relative;
  }
  .rule { width: 64px; height: 4px; background: #1f5fd0; margin-bottom: 40px; }
  .name {
    font-size: 112px; font-weight: 700; color: #1f2328;
    letter-spacing: -2px; line-height: 1; margin-bottom: 28px;
  }
  .slogan {
    font-size: 52px; font-weight: 500; color: #1f5fd0;
    line-height: 1.25; letter-spacing: 1px;
  }
  .sub {
    font-size: 28px; font-weight: 400; color: #565d66;
    letter-spacing: 2px; margin-top: 20px;
  }
  .domain {
    position: absolute; right: 88px; bottom: 72px;
    font-size: 24px; color: #676d75; letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="rule"></div>
    <div class="name">默语</div>
    <div class="slogan">用代码创造价值</div>
    <div class="sub">YPC-C · 个人作品集</div>
    <div class="domain">ypc-website.pages.dev</div>
  </div>
</body>
</html>
