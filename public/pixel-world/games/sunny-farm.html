<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暖阳农场 · SUNNY FARM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%23ffd94d'/%3E%3Crect x='1' y='5' width='6' height='2' fill='%238b5a2b'/%3E%3Crect x='3' y='2' width='2' height='3' fill='%232e7d4f'/%3E%3Crect x='2' y='3' width='1' height='1' fill='%233cb371'/%3E%3Crect x='5' y='3' width='1' height='1' fill='%233cb371'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/fonts.css">
<style>
:root{
  --font-px:'Press Start 2P',monospace;
  --font-cn:'ArkPixel','DotGothic16','Microsoft YaHei','PingFang SC',sans-serif;
  --sky1:#ffe9b8; --sky2:#ffd98a; --sky3:#ffc96b;
  --soil:#8b5a2b; --soil2:#6e4420; --soil3:#a9743f;
  --grass:#7cb342; --grass2:#558b2f;
  --ink:#4a3421; --ink2:#8a6b45; --faint:#b89b6e;
  --panel:#fff6df; --panel2:#ffeec6;
  --frame:#7a5230; --coin:#e8a317; --red:#c0392b; --green:#2e7d4f;
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{
  font-family:var(--font-cn);
  color:var(--ink);
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
  background:linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 45%, var(--sky3) 100%);
  transition:background 6s linear;
  padding:0 0 60px;
}

/* ============ 天空装饰 ============ */
.sky-deco{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.sun{
  position:absolute; top:26px; right:44px; width:54px; height:54px;
  background:#ffcf3f;
  box-shadow:
    0 0 0 6px rgba(255,207,63,.35), 0 0 0 14px rgba(255,207,63,.18),
    0 0 42px rgba(255,190,40,.75);
  animation:sunpulse 5s steps(2) infinite;
}
@keyframes sunpulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
.cloud{
  position:absolute; height:22px; background:#fffdf4; opacity:.92;
  box-shadow:14px -10px 0 0 #fffdf4, 28px 0 0 0 #fffdf4, 42px -8px 0 0 #fffdf4;
  animation:drift 46s linear infinite;
}
.cloud.c1{ top:60px; left:-120px; }
.cloud.c2{ top:130px; left:-200px; animation-duration:64s; animation-delay:-20s; transform:scale(.8); }
.cloud.c3{ top:36px; left:-320px; animation-duration:80s; animation-delay:-55s; transform:scale(.65); }
@keyframes drift{ from{ margin-left:0; } to{ margin-left:110vw; } }
.butterfly{
  position:absolute; width:10px; height:8px; opacity:.9;
  background:#ff8fa3;
  box-shadow:5px 0 0 0 #ffc2ce;
  animation:fly 22s ease-in-out infinite, flap .3s steps(2) infinite;
}
.butterfly.b2{ top:200px; animation-duration:28s; animation-delay:-8s; background:#b388ff; box-shadow:5px 0 0 0 #d1c4e9; }
@keyframes fly{
  0%{ margin:0 0 0 -40px; }
  25%{ margin:-60px 0 0 40vw; }
  50%{ margin:20px 0 0 70vw; }
  75%{ margin:80px 0 0 30vw; }
  100%{ margin:0 0 0 -40px; }
}
@keyframes flap{ 0%,100%{ transform:scaleX(1); } 50%{ transform:scaleX(.6); } }
.petal{
  position:absolute; top:-20px; width:7px; height:7px; background:#ffb3c6;
  box-shadow:0 -4px 0 0 #ffc2ce;
  animation:fall linear forwards;
}
@keyframes fall{
  from{ transform:translateY(-20px) rotate(0deg); }
  to{ transform:translateY(105vh) rotate(340deg); }
}

/* ============ 布局 ============ */
.wrap{ position:relative; z-index:1; max-width:1060px; margin-inline:auto; padding:24px 16px 0; }

.pxpanel{
  background:var(--panel);
  box-shadow:
    inset -4px -4px 0 rgba(0,0,0,.10), inset 4px 4px 0 rgba(255,255,255,.55),
    0 -4px 0 0 var(--frame), 0 4px 0 0 var(--frame),
    -4px 0 0 0 var(--frame), 4px 0 0 0 var(--frame),
    10px 10px 0 0 rgba(60,40,15,.22);
}

/* ============ 顶栏 ============ */
.topbar{ padding:14px 18px; margin-bottom:16px; }
.topbar .t-row{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
.topbar h1{ font-size:24px; letter-spacing:.05em; color:#8a5a1e; text-shadow:2px 2px 0 rgba(255,255,255,.7), 4px 4px 0 rgba(122,82,48,.18); }
.topbar .en{ font-family:var(--font-px); font-size:9px; color:var(--ink2); letter-spacing:.14em; }
.topbar .day{ margin-left:auto; font-family:var(--font-px); font-size:11px; color:#c98d2e; }
.stats{ display:flex; gap:8px 24px; flex-wrap:wrap; margin-top:10px; padding-top:10px; border-top:3px dashed rgba(122,82,48,.3); }
.stat{ font-size:15px; }
.stat b{ font-family:var(--font-px); font-size:8px; color:var(--ink2); display:block; letter-spacing:.1em; margin-bottom:1px; }
.stat span{ font-size:17px; font-weight:700; }
.coin{ color:var(--coin); font-family:var(--font-px); font-size:12px !important; }
.xpbar{ width:110px; height:12px; background:#eccf8f; box-shadow:inset 2px 2px 0 rgba(0,0,0,.15), 0 0 0 2px var(--frame); display:inline-block; vertical-align:middle; margin-right:6px; }
.xpbar i{ display:block; height:100%; background:repeating-linear-gradient(90deg,#7cb342 0 6px,#8bc34a 6px 12px); transition:width .3s steps(4); }

/* ============ 田地 ============ */
.farm-wrap{ padding:16px; margin-bottom:16px; }
.farm-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
.farm-head h2{ font-size:17px; color:#8a5a1e; }
.farm-head small{ font-size:13px; color:var(--ink2); }
.farm{
  display:grid; gap:10px;
  grid-template-columns:repeat(3, 1fr);
}
.plot{
  position:relative; aspect-ratio:1/1;
  background:
    repeating-linear-gradient(90deg, var(--soil) 0 8px, var(--soil3) 8px 16px),
    var(--soil);
  box-shadow:
    inset -3px -3px 0 rgba(0,0,0,.28), inset 3px 3px 0 rgba(255,255,255,.14),
    0 0 0 3px var(--soil2);
  cursor:pointer; display:grid; place-items:center;
  transition:transform .08s steps(2), filter .15s;
  user-select:none;
}
.plot:hover{ filter:brightness(1.08); transform:translateY(-2px); }
.plot.empty::after{
  content:"+"; position:absolute; font-size:22px; color:rgba(255,255,255,.35);
}
.plot.ripe{ box-shadow: inset -3px -3px 0 rgba(0,0,0,.28), inset 3px 3px 0 rgba(255,255,255,.14), 0 0 0 3px var(--soil2), 0 0 18px rgba(255,213,79,.85); }
.plot svg{ display:block; }
.plot .tag{
  position:absolute; top:3px; left:4px; font-family:var(--font-px); font-size:6px;
  color:#ffe9a8; text-shadow:1px 1px 0 rgba(0,0,0,.6);
}
.plot .water-dot{
  position:absolute; width:4px; height:4px; background:#7ec8ff;
  animation:drip .6s steps(4) forwards; pointer-events:none;
}
@keyframes drip{ from{ transform:translateY(0); opacity:1; } to{ transform:translateY(-26px); opacity:0; } }
.pop-gain{
  position:absolute; left:50%; top:30%; transform:translateX(-50%);
  font-family:var(--font-px); font-size:10px; color:#ffd94d;
  text-shadow:1px 1px 0 #7a5230, 2px 2px 0 rgba(0,0,0,.4);
  animation:gain .8s steps(5) forwards; pointer-events:none; white-space:nowrap;
}
@keyframes gain{ from{ transform:translate(-50%,0); opacity:1; } to{ transform:translate(-50%,-34px); opacity:0; } }

/* ============ 种子栏 & 升级 ============ */
.dock{ display:grid; grid-template-columns:1.5fr 1fr; gap:16px; align-items:start; }
.seeds{ padding:14px 16px; }
.seeds h2, .shop h2{ font-size:16px; color:#8a5a1e; margin-bottom:10px; }
.seed-list{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.seed-card{
  background:var(--panel2); padding:8px 6px 10px; text-align:center; cursor:pointer;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.10), inset 3px 3px 0 rgba(255,255,255,.6), 0 0 0 3px rgba(122,82,48,.4);
  transition:transform .08s steps(2), box-shadow .12s;
  user-select:none; position:relative;
}
.seed-card:hover{ transform:translateY(-2px); }
.seed-card.sel{ box-shadow:inset -3px -3px 0 rgba(0,0,0,.10), inset 3px 3px 0 rgba(255,255,255,.6), 0 0 0 3px #e8a317, 0 0 16px rgba(232,163,23,.5); }
.seed-card.locked{ opacity:.5; cursor:not-allowed; }
.seed-card.locked:hover{ transform:none; }
.seed-card .s-name{ font-size:14px; display:block; margin-top:4px; }
.seed-card .s-meta{ font-family:var(--font-px); font-size:7px; color:var(--ink2); display:block; margin-top:3px; }
.seed-card .s-price{ font-size:13px; color:var(--coin); font-weight:700; display:block; margin-top:2px; }
.seed-card .lock{ position:absolute; inset:0; display:grid; place-items:center; font-size:12px; color:#fff; text-shadow:1px 1px 0 rgba(0,0,0,.5); }
.shop{ padding:14px 16px; }
.shop-item{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:2px dashed rgba(122,82,48,.25); }
.shop-item:last-child{ border-bottom:0; }
.shop-item .si-ico{ width:26px; height:26px; flex:none; display:grid; place-items:center; background:var(--panel2); box-shadow:0 0 0 2px rgba(122,82,48,.4); }
.shop-item .si-txt{ flex:1; min-width:0; }
.shop-item .si-txt b{ font-size:14px; display:block; }
.shop-item .si-txt small{ font-size:11px; color:var(--ink2); }
.shop-item .pxbtn{ flex:none; }
.pxbtn{
  font-family:var(--font-cn); font-size:13px; line-height:1;
  color:#fff8e6; background:#c98d2e;
  border:0; cursor:pointer; padding:8px 12px;
  box-shadow:
    inset -3px -3px 0 rgba(0,0,0,.25), inset 3px 3px 0 rgba(255,255,255,.22),
    0 -3px 0 0 #8a5a1e, 0 3px 0 0 #8a5a1e, -3px 0 0 0 #8a5a1e, 3px 0 0 0 #8a5a1e,
    5px 5px 0 0 rgba(60,40,15,.25);
  transition:transform .08s steps(2), background-color .12s, box-shadow .08s steps(2);
  user-select:none;
}
.pxbtn:hover{ background:#dd9f3c; transform:translateY(-2px); }
.pxbtn:active{
  transform:translate(3px,3px);
  box-shadow:
    inset -3px -3px 0 rgba(0,0,0,.25), inset 3px 3px 0 rgba(255,255,255,.22),
    0 -3px 0 0 #8a5a1e, 0 3px 0 0 #8a5a1e, -3px 0 0 0 #8a5a1e, 3px 0 0 0 #8a5a1e,
    0 0 0 0 rgba(60,40,15,.25);
}
.pxbtn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
.pxbtn:disabled:hover{ background:#c98d2e; transform:none; }

/* ============ 日志 ============ */
.logbox{ margin-top:16px; padding:12px 16px; }
.logbox h2{ font-size:15px; color:#8a5a1e; margin-bottom:8px; }
.logbox ul{ list-style:none; display:grid; gap:4px; }
.logbox li{ font-size:14px; color:var(--ink2); padding-left:15px; position:relative; }
.logbox li::before{ content:"❀"; position:absolute; left:0; font-size:10px; top:2px; color:#e8a317; }
.logbox li:first-child{ color:var(--ink); }

@media (max-width:820px){
  .dock{ grid-template-columns:1fr; }
  .seed-list{ grid-template-columns:repeat(2,1fr); }
}
</style>
</head>
<body>

<div class="sky-deco" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="butterfly b1"></div>
  <div class="butterfly b2"></div>
</div>

<div class="wrap">

  <header class="topbar pxpanel">
    <div class="t-row">
      <h1>暖阳农场</h1>
      <span class="en">SUNNY FARM</span>
      <span class="day" id="s-day">DAY 1</span>
    </div>
    <div class="stats">
      <div class="stat"><b>COINS 金币</b><span class="coin" id="s-coins">30</span></div>
      <div class="stat"><b>LEVEL 等级</b><span id="s-lv">Lv.1</span> <span class="xpbar"><i id="s-xp" style="width:0%"></i></span></div>
      <div class="stat"><b>PLOTS 田地</b><span id="s-plots">9 块</span></div>
      <div class="stat"><b>NEXT 下一季</b><span id="s-next" style="font-size:14px">--</span></div>
    </div>
  </header>

  <section class="farm-wrap pxpanel">
    <div class="farm-head">
      <h2>责任田</h2>
      <small id="farm-tip">空地点 = 播种 · 嫩苗 = 浇水 · 发光 = 收获</small>
    </div>
    <div class="farm" id="farm"></div>
  </section>

  <div class="dock">
    <section class="seeds pxpanel">
      <h2>种子铺</h2>
      <div class="seed-list" id="seed-list"></div>
    </section>

    <section class="shop pxpanel">
      <h2>农场商店</h2>
      <div id="shop-list"></div>
    </section>
  </div>

  <section class="logbox pxpanel">
    <h2>农场日记</h2>
    <ul id="log"></ul>
  </section>

</div>

<script>
/* ==================== 数据 ==================== */
var CROPS = {
  wheat:     { name:'小麦',   seed:5,  stages:3, price:14,  xp:2,  lv:1 },
  carrot:    { name:'胡萝卜', seed:12, stages:4, price:36,  xp:4,  lv:1 },
  pumpkin:   { name:'南瓜',   seed:30, stages:5, price:95,  xp:7,  lv:2 },
  sunflower: { name:'向日葵', seed:55, stages:6, price:190, xp:12, lv:4 }
};
var CROP_ORDER = ['wheat','carrot','pumpkin','sunflower'];
var DAY_MS = 60000;              /* 一天 = 60 秒 */
var UPGRADES = {
  land1: { name:'开荒拓地', desc:'+3 块良田', cost:120 },
  land2: { name:'田庄扩建', desc:'+4 块良田', cost:300 },
  land3: { name:'沃野千里', desc:'+4 块良田', cost:700 },
  greenhouse: { name:'暖棚温室', desc:'作物自然生长 ×1.5', cost:500 },
  hoe: { name:'金锄头', desc:'收获 20% 概率双倍', cost:800 }
};
var SAVE_KEY = 'sunny_farm_save_v1';

/* ==================== 音效 ==================== */
var actx = null;
function beep(freq, dur, type, vol, when){
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    var t = actx.currentTime + (when || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .08, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur);
  }catch(e){}
}
var sfx = {
  plant: function(){ beep(180, .09, 'square', .06); },
  water: function(){ beep(520, .07, 'sine', .07); beep(700, .06, 'sine', .05, .06); },
  harvest: function(){ beep(523, .08, 'square', .07); beep(659, .08, 'square', .07, .08); beep(784, .12, 'square', .07, .16); },
  coin: function(){ beep(880, .06, 'square', .06); beep(1174, .1, 'square', .06, .06); },
  upgrade: function(){ beep(392, .07, 'square', .07); beep(523, .07, 'square', .07, .07); beep(659, .07, 'square', .07, .14); beep(784, .16, 'square', .07, .21); },
  nope: function(){ beep(140, .12, 'sawtooth', .05); }
};

/* ==================== 状态 ==================== */
var state;
var selectedSeed = 'wheat';

function defaultState(){
  return {
    coins: 30, xp: 0, lv: 1,
    day: 1, dayStart: Date.now(),
    cols: 3, plots: [],
    upgrades: {},
    log: []
  };
}

function newGame(){
  state = defaultState();
  for(var i = 0; i < 9; i++) state.plots.push({ crop:null, prog:0, watered:false });
  addLog('晨光洒进村子，你分到了 9 块良田和 30 枚金币。慢慢来，把日子过甜。');
  save();
  render();
}

/* ==================== 存档 ==================== */
function save(){
  try{
    var d = {
      coins: state.coins, xp: state.xp, lv: state.lv, day: state.day,
      cols: state.cols, plots: state.plots, upgrades: state.upgrades,
      log: state.log.slice(0, 12),
      dayStart: Date.now()
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(d));
  }catch(e){}
}
function load(){
  var d = null;
  try{ d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); }catch(e){}
  if(!d) return false;
  state = defaultState();
  state.coins = d.coins || 0; state.xp = d.xp || 0; state.lv = d.lv || 1;
  state.cols = d.cols || 3; state.plots = d.plots || []; state.upgrades = d.upgrades || {};
  state.log = d.log || [];
  /* 离线补天数（每 60 秒一天，最多补 12 天） */
  var away = Math.floor((Date.now() - (d.dayStart || Date.now())) / DAY_MS);
  if(away > 0){
    var grow = state.upgrades.greenhouse ? 1.5 : 1;
    for(var day = 0; day < Math.min(away, 12); day++){
      state.day++;
      for(var i = 0; i < state.plots.length; i++){
        var p = state.plots[i];
        if(p.crop && p.prog < CROPS[p.crop].stages){
          p.prog = Math.min(CROPS[p.crop].stages, p.prog + grow);
          p.watered = false;
        }
      }
    }
    if(away > 0) state.log.unshift('离线的 ' + Math.min(away,12) + ' 天里，庄稼悄悄长大了。');
  }
  state.dayStart = Date.now();
  return true;
}

/* ==================== 生长 ==================== */
function tick(){
  var now = Date.now();
  if(now - state.dayStart >= DAY_MS){
    state.dayStart = now;
    state.day++;
    var grow = state.upgrades.greenhouse ? 1.5 : 1;
    for(var i = 0; i < state.plots.length; i++){
      var p = state.plots[i];
      if(p.crop && p.prog < CROPS[p.crop].stages){
        p.prog = Math.min(CROPS[p.crop].stages, p.prog + grow);
        p.watered = false;
      }
    }
    addLog('第 ' + state.day + ' 天，日头翻过山头，新的一天开始了。');
    save();
  }
  render();
}

/* ==================== 交互 ==================== */
function clickPlot(idx){
  var p = state.plots[idx];
  if(!p.crop){
    /* 播种 */
    var seed = selectedSeed, c = CROPS[seed];
    if(state.lv < c.lv){ toast('等级不够，' + c.name + '种子要 Lv.' + c.lv + ' 解锁'); sfx.nope(); return; }
    if(state.coins < c.seed){ toast('金币不够买' + c.name + '种子'); sfx.nope(); return; }
    state.coins -= c.seed;
    p.crop = seed; p.prog = 0; p.watered = false;
    addLog('播下了' + c.name + '种子（-' + c.seed + '）。');
    sfx.plant();
  } else if(p.prog >= CROPS[p.crop].stages){
    /* 收获 */
    var crop = CROPS[p.crop];
    var gain = crop.price;
    var double = state.upgrades.hoe && Math.random() < 0.2;
    if(double) gain *= 2;
    state.coins += gain;
    state.xp += crop.xp;
    var need = state.lv * 50;
    if(state.xp >= need){
      state.lv++; state.xp -= need;
      addLog('升级到 Lv.' + state.lv + '！有新种子可以买了。');
      sfx.upgrade();
    }
    p.crop = null; p.prog = 0; p.watered = false;
    addLog('收获了' + crop.name + '，+' + gain + ' 金币' + (double ? '（金锄头双倍！）' : '') + '。');
    sfx.harvest(); sfx.coin();
    var el = document.querySelector('[data-plot="' + idx + '"]');
    if(el){
      var g = document.createElement('span');
      g.className = 'pop-gain'; g.textContent = '+' + gain;
      el.appendChild(g);
      setTimeout(function(){ if(g.parentNode) g.parentNode.removeChild(g); }, 820);
    }
  } else {
    /* 浇水 */
    if(p.watered){ toast('今天浇过啦，明天再来'); sfx.nope(); return; }
    p.watered = true;
    p.prog = Math.min(CROPS[p.crop].stages, p.prog + 1);
    sfx.water();
    addLog('给' + CROPS[p.crop].name + '浇了水，长得更快了。');
    var el2 = document.querySelector('[data-plot="' + idx + '"]');
    if(el2){
      for(var d = 0; d < 3; d++){
        var w = document.createElement('span');
        w.className = 'water-dot';
        w.style.left = (34 + d * 10) + '%';
        w.style.animationDelay = (d * .08) + 's';
        el2.appendChild(w);
        (function(node){ setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, 700); })(w);
      }
    }
  }
  save();
  render();
}

function buyUpgrade(id){
  var u = UPGRADES[id];
  if(state.upgrades[id]) return;
  if(state.coins < u.cost){ toast('金币不够（需要 ' + u.cost + '）'); sfx.nope(); return; }
  state.coins -= u.cost;
  state.upgrades[id] = true;
  if(id === 'land1'){ for(var i = 0; i < 3; i++) state.plots.push({ crop:null, prog:0, watered:false }); state.cols = 4; }
  if(id === 'land2'){ for(var j = 0; j < 4; j++) state.plots.push({ crop:null, prog:0, watered:false }); state.cols = 4; }
  if(id === 'land3'){ for(var k = 0; k < 4; k++) state.plots.push({ crop:null, prog:0, watered:false }); state.cols = 5; }
  addLog('买下了「' + u.name + '」：' + u.desc + '。');
  sfx.upgrade();
  save();
  render();
}

/* ==================== 渲染 ==================== */
function xpNeed(){ return state.lv * 50; }

function cropSvg(crop, stage){
  var s = '<svg width="44" height="44" viewBox="0 0 32 32" shape-rendering="crispEdges" aria-hidden="true">';
  if(crop === 'wheat'){
    if(stage < 1){ s += '<rect x="14" y="24" width="4" height="3" fill="#558b2f"/>'; }
    else if(stage < 2){ s += '<rect x="14" y="20" width="3" height="8" fill="#7cb342"/><rect x="11" y="21" width="3" height="2" fill="#8bc34a"/><rect x="18" y="19" width="3" height="2" fill="#8bc34a"/>'; }
    else { s += '<rect x="15" y="14" width="3" height="13" fill="#8d6e63"/><rect x="13" y="10" width="7" height="5" fill="#ffd54f"/><rect x="14" y="12" width="5" height="2" fill="#ffe082"/><rect x="12" y="14" width="3" height="3" fill="#ffca28"/><rect x="18" y="14" width="3" height="3" fill="#ffca28"/>'; }
  } else if(crop === 'carrot'){
    if(stage < 1){ s += '<rect x="14" y="24" width="4" height="3" fill="#558b2f"/>'; }
    else if(stage < 2){ s += '<rect x="14" y="21" width="3" height="7" fill="#7cb342"/><rect x="11" y="22" width="3" height="2" fill="#8bc34a"/><rect x="18" y="21" width="3" height="2" fill="#8bc34a"/>'; }
    else if(stage < 3){ s += '<rect x="14" y="17" width="4" height="9" fill="#e67e22"/><rect x="12" y="15" width="3" height="3" fill="#2e7d4f"/><rect x="17" y="14" width="3" height="3" fill="#2e7d4f"/><rect x="14" y="14" width="3" height="3" fill="#3cb371"/>'; }
    else { s += '<rect x="12" y="14" width="8" height="11" fill="#e67e22"/><rect x="13" y="25" width="6" height="2" fill="#d35400"/><rect x="9" y="11" width="4" height="4" fill="#2e7d4f"/><rect x="19" y="10" width="4" height="4" fill="#2e7d4f"/><rect x="13" y="10" width="5" height="4" fill="#3cb371"/><rect x="14" y="17" width="2" height="2" fill="#f39c12" opacity=".7"/>'; }
  } else if(crop === 'pumpkin'){
    if(stage < 1){ s += '<rect x="14" y="24" width="4" height="3" fill="#558b2f"/>'; }
    else if(stage < 2){ s += '<rect x="14" y="20" width="3" height="8" fill="#558b2f"/><rect x="16" y="18" width="6" height="2" fill="#7cb342"/><rect x="20" y="20" width="2" height="2" fill="#7cb342"/>'; }
    else if(stage < 3){ s += '<rect x="14" y="19" width="3" height="7" fill="#558b2f"/><rect x="12" y="17" width="7" height="4" fill="#ffb74d"/><rect x="13" y="18" width="2" height="2" fill="#ffe0b2"/><rect x="10" y="20" width="4" height="2" fill="#7cb342"/>'; }
    else if(stage < 4){ s += '<rect x="15" y="17" width="3" height="9" fill="#558b2f"/><rect x="10" y="17" width="12" height="9" fill="#f57c00"/><rect x="11" y="18" width="3" height="3" fill="#ffb74d"/><rect x="17" y="22" width="3" height="3" fill="#ffb74d"/><rect x="14" y="15" width="4" height="3" fill="#33691e"/>'; }
    else { s += '<rect x="15" y="15" width="3" height="10" fill="#558b2f"/><rect x="7" y="15" width="18" height="11" fill="#f57c00"/><rect x="9" y="17" width="4" height="3" fill="#ffb74d"/><rect x="16" y="21" width="4" height="3" fill="#ffb74d"/><rect x="12" y="12" width="8" height="3" fill="#33691e"/><rect x="8" y="18" width="2" height="2" fill="#e65100" opacity=".6"/><rect x="21" y="20" width="2" height="2" fill="#e65100" opacity=".6"/>'; }
  } else { /* sunflower */
    if(stage < 1){ s += '<rect x="14" y="24" width="4" height="3" fill="#558b2f"/>'; }
    else if(stage < 2){ s += '<rect x="14" y="21" width="3" height="7" fill="#7cb342"/><rect x="11" y="22" width="3" height="2" fill="#8bc34a"/><rect x="18" y="21" width="3" height="2" fill="#8bc34a"/>'; }
    else if(stage < 3){ s += '<rect x="15" y="16" width="3" height="12" fill="#558b2f"/><rect x="12" y="22" width="4" height="2" fill="#7cb342"/><rect x="17" y="19" width="4" height="2" fill="#7cb342"/><rect x="13" y="13" width="7" height="4" fill="#9ccc65"/>'; }
    else if(stage < 4){ s += '<rect x="15" y="14" width="3" height="14" fill="#558b2f"/><rect x="12" y="21" width="4" height="2" fill="#7cb342"/><rect x="17" y="18" width="4" height="2" fill="#7cb342"/><circle cx="16" cy="11" r="5" fill="#ffd54f"/><circle cx="16" cy="11" r="2" fill="#8d6e63"/>'; }
    else if(stage < 5){ s += '<rect x="15" y="13" width="3" height="15" fill="#558b2f"/><rect x="11" y="21" width="5" height="2" fill="#7cb342"/><rect x="17" y="18" width="5" height="2" fill="#7cb342"/><circle cx="16" cy="10" r="6" fill="#ffca28"/><circle cx="16" cy="10" r="2.6" fill="#6d4c41"/>'; }
    else { s += '<rect x="15" y="12" width="3" height="16" fill="#558b2f"/><rect x="10" y="22" width="6" height="2" fill="#7cb342"/><rect x="17" y="19" width="6" height="2" fill="#7cb342"/><circle cx="16" cy="9" r="7" fill="#ffd54f"/><circle cx="16" cy="9" r="3" fill="#6d4c41"/><circle cx="13" cy="8" r="1" fill="#fff59d"/><circle cx="18" cy="7" r="1" fill="#fff59d"/>'; }
  }
  return s + '</svg>';
}

function render(){
  document.getElementById('s-coins').textContent = state.coins;
  document.getElementById('s-lv').textContent = 'Lv.' + state.lv;
  document.getElementById('s-xp').style.width = Math.round(state.xp / xpNeed() * 100) + '%';
  document.getElementById('s-plots').textContent = state.plots.length + ' 块';
  document.getElementById('s-day').textContent = 'DAY ' + state.day;

  /* 下一季提示 */
  var next = '--';
  var best = -1;
  for(var i = 0; i < state.plots.length; i++){
    var p = state.plots[i];
    if(p.crop && p.prog < CROPS[p.crop].stages){
      var left = Math.ceil(CROPS[p.crop].stages - p.prog);
      if(best < 0 || left < best) best = left;
    }
  }
  document.getElementById('s-next').textContent = best > 0 ? '最快 ' + best + ' 天' : '有地就种';

  /* 田地 */
  var fh = '';
  for(var j = 0; j < state.plots.length; j++){
    var pl = state.plots[j];
    var cls = 'plot', inner = '', tag = '';
    if(!pl.crop){ cls += ' empty'; }
    else {
      var ripe = pl.prog >= CROPS[pl.crop].stages;
      if(ripe) cls += ' ripe';
      inner = cropSvg(pl.crop, Math.floor(pl.prog));
      tag = ripe ? 'READY' : (pl.watered ? 'WATERED' : 'GROW');
    }
    fh += '<div class="' + cls + '" data-plot="' + j + '" onclick="clickPlot(' + j + ')">'
      + (tag ? '<span class="tag">' + tag + '</span>' : '')
      + inner + '</div>';
  }
  var farm = document.getElementById('farm');
  farm.style.gridTemplateColumns = 'repeat(' + state.cols + ', 1fr)';
  farm.innerHTML = fh;

  /* 种子铺 */
  var sh = '';
  for(var c = 0; c < CROP_ORDER.length; c++){
    var cid = CROP_ORDER[c], cr = CROPS[cid];
    var locked = state.lv < cr.lv;
    sh += '<div class="seed-card' + (selectedSeed === cid ? ' sel' : '') + (locked ? ' locked' : '') + '" onclick="selectSeed(\'' + cid + '\')">'
      + cropSvg(cid, cr.stages)
      + '<span class="s-name">' + cr.name + '</span>'
      + '<span class="s-meta">' + cr.stages + ' 阶段 · 售 ' + cr.price + '</span>'
      + '<span class="s-price">' + cr.seed + ' 金</span>'
      + (locked ? '<span class="lock">Lv.' + cr.lv + ' 解锁</span>' : '')
      + '</div>';
  }
  document.getElementById('seed-list').innerHTML = sh;

  /* 商店 */
  var ph = '';
  var ids = ['land1','land2','land3','greenhouse','hoe'];
  for(var u = 0; u < ids.length; u++){
    var uid = ids[u], up = UPGRADES[uid];
    var owned = !!state.upgrades[uid];
    ph += '<div class="shop-item">'
      + '<span class="si-ico">' + (uid === 'greenhouse' ? '🏠' : uid === 'hoe' ? '⛏' : '🌾') + '</span>'
      + '<span class="si-txt"><b>' + up.name + '</b><small>' + up.desc + '</small></span>'
      + (owned
        ? '<span style="color:var(--green);font-size:13px;font-weight:700">已拥有</span>'
        : '<button class="pxbtn" onclick="buyUpgrade(\'' + uid + '\')" ' + (state.coins < up.cost ? 'disabled' : '') + '>' + up.cost + ' 金</button>')
      + '</div>';
  }
  document.getElementById('shop-list').innerHTML = ph;

  /* 日志 */
  var lh = '';
  for(var l = 0; l < Math.min(state.log.length, 7); l++) lh += '<li>' + state.log[l] + '</li>';
  document.getElementById('log').innerHTML = lh;
}

function selectSeed(id){
  if(state.lv < CROPS[id].lv){ toast('等级不够，' + CROPS[id].name + '种子要 Lv.' + CROPS[id].lv + ' 解锁'); sfx.nope(); return; }
  selectedSeed = id;
  render();
}

/* ==================== 日志 / Toast ==================== */
function addLog(msg){
  state.log.unshift(msg);
  if(state.log.length > 20) state.log.pop();
}

var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:99;background:#4a3421;color:#fff6df;font-size:14px;padding:10px 18px;box-shadow:0 0 0 3px #8a5a1e,6px 6px 0 rgba(60,40,15,.3);transition:opacity .2s steps(2)';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.style.opacity = '0'; }, 1500);
}

/* ==================== 花瓣雨 ==================== */
setInterval(function(){
  if(Math.random() < 0.5){
    var p = document.createElement('span');
    p.className = 'petal';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (4 + Math.random() * 3) + 's';
    p.style.opacity = String(0.5 + Math.random() * 0.5);
    document.querySelector('.sky-deco').appendChild(p);
    setTimeout(function(){ if(p.parentNode) p.parentNode.removeChild(p); }, 7500);
  }
}, 1600);

/* ==================== 开局 ==================== */
if(!load()) newGame();
else { render(); }
setInterval(tick, 1000);
window.addEventListener('beforeunload', save);
</script>
</body>
</html>
