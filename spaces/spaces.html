<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的空间 · My Spaces</title>
<link rel="stylesheet" href="../assets/css/option-wheel.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Inter", sans-serif;
    background: #0a101c;
    color: #e6eef7;
    height: 100vh;
    overflow: hidden;
  }

  /* ---- 画面全屏铺满 ---- */
  .stage { position: fixed; inset: 0; z-index: 1; background: #0a101c; }
  /* iframe 不做 transform/opacity 动画：避免与内部 WebGL 渲染争抢合成导致切换卡顿；
     切换改由 .veil 遮罩过渡完成（见下方） */
  .stage iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; opacity: 0; visibility: hidden;
  }
  .stage iframe.is-active { opacity: 1; visibility: visible; }

  /* 转场遮罩：淡入遮住画面 → 切换 iframe → 淡出 */
  .veil {
    position: fixed; inset: 0; z-index: 15; pointer-events: none;
    background: #0a101c; opacity: 0;
    transition: opacity 0.2s ease;
  }
  .veil.is-on { opacity: 0.96; }

  /* ---- 左上角返回 ---- */
  .back {
    position: fixed; top: 18px; left: 22px; z-index: 30;
    color: rgba(220, 230, 245, 0.9); text-decoration: none;
    font-size: 13px; letter-spacing: 1px;
    border: 1px solid rgba(160, 190, 230, 0.4);
    padding: 8px 16px; border-radius: 999px;
    background: rgba(14, 22, 38, 0.55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: background 0.2s, transform 0.15s;
  }
  .back:hover { background: rgba(45, 70, 110, 0.85); transform: translateY(-1px); }

  /* ---- 左侧浮层：轮盘 ---- */
  .panel {
    position: fixed; left: 0; top: 50%; transform: translateY(-50%);
    z-index: 20;
    width: 240px;
    padding: 16px 0 16px 14px;
    display: flex; flex-direction: column; justify-content: center;
    /* 透明浮层：不遮挡画面，仅文字可见 */
    background: transparent;
    /* 除轮盘外，空白区域不拦截鼠标，画面可正常拖拽旋转 */
    pointer-events: none;
  }
  .panel > * { pointer-events: auto; }

  .panel-label {
    font-size: 11px; letter-spacing: 4px;
    color: rgba(170, 195, 225, 0.7);
    margin-bottom: 2px;
  }
  #wheel { width: 100%; }
  /* 覆盖默认高度，避免小屏溢出；轮盘在浮层内垂直居中 */
  #wheel .option-wheel { height: clamp(260px, 46vh, 420px); }

  .panel-hint {
    font-size: 11px; letter-spacing: 1px;
    color: rgba(170, 195, 225, 0.5);
    margin-top: 4px; line-height: 1.7;
  }

  /* 透明浮层下，文字随场景明暗自适应，保证两种背景都清晰 */
  .panel[data-theme="dark"] .panel-label { color: rgba(200, 220, 245, 0.9); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85); }
  .panel[data-theme="dark"] .panel-hint  { color: rgba(200, 220, 245, 0.62); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85); }
  .panel[data-theme="light"] .panel-label { color: rgba(52, 62, 48, 0.82); text-shadow: 0 1px 6px rgba(255, 255, 255, 0.95); }
  .panel[data-theme="light"] .panel-hint  { color: rgba(52, 62, 48, 0.58); text-shadow: 0 1px 6px rgba(255, 255, 255, 0.95); }

  .option-wheel.theme-dark .option-wheel__item  { text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9); }
  .option-wheel.theme-light .option-wheel__item { text-shadow: 0 1px 10px rgba(255, 255, 255, 0.98); }

  @media (max-width: 760px) {
    .panel { width: 210px; padding-left: 14px; }
    #wheel .option-wheel { height: 200px; }
    .panel-hint { display: none; }
  }
</style>
</head>
<body>
  <a class="back" href="../home/index.html#about">← 返回主页</a>

  <main class="stage">
    <iframe id="frame-0" class="is-active" src="rainy-night-konbini.html" title="雨夜便利店"></iframe>
    <iframe id="frame-1" src="weather-cards.html" title="气象之间"></iframe>
  </main>
  <div class="veil" id="veil"></div>

  <aside class="panel">
    <div class="panel-label">选择空间</div>
    <div id="wheel"></div>
    <div class="panel-hint">滚轮 / 拖拽 / ↑↓ 切换</div>
  </aside>

  <script src="../assets/js/option-wheel.js"></script>
  <script>
    var frames = [
      document.getElementById('frame-0'),
      document.getElementById('frame-1')
    ];

    /* 转场：遮罩淡入遮住画面 → 切换 iframe 显隐（iframe 无动画，不与 WebGL 争合成）→ 遮罩淡出 */
    var veil = document.getElementById('veil');
    var busy = false, pending = null;
    function switchTo(i) {
      if (busy) { pending = i; return; }   // 切换中再次触发则排队，取最新目标
      busy = true;
      veil.classList.add('is-on');
      setTimeout(function () {
        for (var idx = 0; idx < frames.length; idx++) {
          frames[idx].classList.toggle('is-active', idx === i);
        }
        applyTheme(i);
        veil.classList.remove('is-on');
        setTimeout(function () {
          busy = false;
          if (pending !== null) { var next = pending; pending = null; switchTo(next); }
        }, 220);
      }, 220);
    }

    var panel = document.querySelector('.panel');

    // 各场景对应的文字配色：0=雨夜（暗背景→浅字），1=气象（浅背景→深字）
    var THEME = {
      0: { theme: 'dark',  text: '#cfe0f2', active: '#ffffff' },
      1: { theme: 'light', text: '#4a5645', active: '#22301f' }
    };

    function applyTheme(i) {
      var t = THEME[i] || THEME[0];
      panel.setAttribute('data-theme', t.theme);
      wheel.root.classList.toggle('theme-dark', t.theme === 'dark');
      wheel.root.classList.toggle('theme-light', t.theme === 'light');
      wheel.root.style.setProperty('--ow-text-color', t.text);
      wheel.root.style.setProperty('--ow-active-color', t.active);
    }

    var wheel = OptionWheel({
      items: ['雨夜便利店', '气象之间'],
      defaultSelected: 0,
      side: 'left',
      fontSize: 1.6,
      spacing: 1.8,
      tilt: 9,
      curve: 1,
      blur: 1.5,
      fade: 0.3,
      textColor: '#cfe0f2',
      activeColor: '#ffffff',
      onChange: function (i) {
        switchTo(i);
      }
    });
    document.getElementById('wheel').appendChild(wheel.root);
    applyTheme(0);
  </script>
</body>
</html>
